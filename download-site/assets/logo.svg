      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="45%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="swarm-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.9" />
