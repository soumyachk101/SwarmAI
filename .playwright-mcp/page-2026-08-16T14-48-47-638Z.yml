                  - 'link "Permalink: Karpathy''s four failure modes? Already covered." [ref=e2356] [cursor=pointer]':
                    - /url: "#karpathys-four-failure-modes-already-covered"
                - paragraph [ref=e2359]:
                  - text: Andrej Karpathy's
                  - link "AI coding rules" [ref=e2360] [cursor=pointer]:
                    - /url: https://github.com/forrestchang/andrej-karpathy-skills
                  - text: "(17K stars) nail four failure modes: wrong assumptions, overcomplexity, orthogonal edits, imperative over declarative. gstack's workflow skills enforce all four."
                  - code [ref=e2361]: /office-hours
                  - text: forces assumptions into the open before code is written. The Confusion Protocol stops Claude from guessing on architectural decisions.
                  - code [ref=e2362]: /review
                  - text: catches unnecessary complexity and drive-by edits.
                  - code [ref=e2363]: /ship
                  - text: transforms tasks into verifiable goals with test-first execution. If you already use Karpathy-style CLAUDE.md rules, gstack is the workflow enforcement layer that makes them stick across entire sprints, not just single prompts.
                - generic [ref=e2364]:
                  - heading "Parallel sprints" [level=2] [ref=e2365]
                  - 'link "Permalink: Parallel sprints" [ref=e2366] [cursor=pointer]':
                    - /url: "#parallel-sprints"
                - paragraph [ref=e2369]: gstack works well with one sprint. It gets interesting with ten running at once.
                - paragraph [ref=e2370]:
                  - strong [ref=e2371]: Design is at the heart.
                  - code [ref=e2372]: /design-consultation
                  - text: builds your design system from scratch, researches what's out there, proposes creative risks, and writes
                  - code [ref=e2373]: DESIGN.md
                  - text: . But the real magic is the shotgun-to-HTML pipeline.
                - paragraph [ref=e2374]:
                  - strong [ref=e2375]:
                    - code [ref=e2376]: /design-shotgun
                    - text: is how you explore.
                  - text: You describe what you want. It generates 4-6 AI mockup variants using GPT Image. Then it opens a comparison board in your browser with all variants side by side. You pick favorites, leave feedback ("more whitespace", "bolder headline", "lose the gradient"), and it generates a new round. Repeat until you love something. Taste memory kicks in after a few rounds so it starts biasing toward what you actually like. No more describing your vision in words and hoping the AI gets it. You see options, pick the good ones, and iterate visually.
                - paragraph [ref=e2377]:
                  - strong [ref=e2378]:
                    - code [ref=e2379]: /design-html
                    - text: makes it real.
                  - text: Take that approved mockup (from
                  - code [ref=e2380]: /design-shotgun
                  - text: ", a CEO plan, a design review, or just a description) and turn it into production-quality HTML/CSS. Not the kind of AI HTML that looks fine at one viewport width and breaks everywhere else. This uses Pretext for computed text layout: text actually reflows on resize, heights adjust to content, layouts are dynamic. 30KB overhead, zero dependencies. It detects your framework (React, Svelte, Vue) and outputs the right format. Smart API routing picks different Pretext patterns depending on whether it's a landing page, dashboard, form, or card layout. The output is something you'd actually ship, not a demo."
                - paragraph [ref=e2381]:
                  - strong [ref=e2382]:
                    - code [ref=e2383]: /qa
                    - text: was a massive unlock.
                  - text: It let me go from 6 to 12 parallel workers. Claude Code saying
                  - emphasis [ref=e2384]: "\"I SEE THE ISSUE\""
                  - text: and then actually fixing it, generating a regression test, and verifying the fix — that changed how I work. The agent has eyes now.
                - paragraph [ref=e2385]:
                  - strong [ref=e2386]: Smart review routing.
                  - text: "Just like at a well-run startup: CEO doesn't have to look at infra bug fixes, design review isn't needed for backend changes. gstack tracks what reviews are run, figures out what's appropriate, and just does the smart thing. The Review Readiness Dashboard tells you where you stand before you ship."
                - paragraph [ref=e2387]:
                  - strong [ref=e2388]: Test everything.
                  - code [ref=e2389]: /ship
                  - text: bootstraps test frameworks from scratch if your project doesn't have one. Every
                  - code [ref=e2390]: /ship
                  - text: run produces a coverage audit. Every
                  - code [ref=e2391]: /qa
                  - text: bug fix generates a regression test. 100% test coverage is the goal — tests make vibe coding safe instead of yolo coding.
                - paragraph [ref=e2392]:
                  - strong [ref=e2393]:
                    - code [ref=e2394]: /document-release
                    - text: is the engineer you never had.
                  - text: It reads every doc file in your project, cross-references the diff, and updates everything that drifted. README, ARCHITECTURE, CONTRIBUTING, CLAUDE.md, TODOS — all kept current automatically. And now
                  - code [ref=e2395]: /ship
                  - text: auto-invokes it — docs stay current without an extra command.
                - paragraph [ref=e2396]:
                  - strong [ref=e2397]: Real browser mode.
                  - code [ref=e2398]: /open-gstack-browser
                  - text: launches GStack Browser, an AI-controlled Chromium with anti-bot stealth, custom branding, and the sidebar extension baked in. Sites like Google and NYTimes work without captchas. The menu bar says "GStack Browser" instead of "Chrome for Testing." Your regular Chrome stays untouched. All existing browse commands work unchanged.
                  - code [ref=e2399]: $B disconnect
                  - text: returns to headless. The browser stays alive as long as the window is open... no idle timeout killing it while you're working.
                - paragraph [ref=e2400]:
                  - strong [ref=e2401]: Sidebar agent — your AI browser assistant.
                  - text: "Type natural language in the Chrome side panel and a child Claude instance executes it. \"Navigate to the settings page and screenshot it.\" \"Fill out this form with test data.\" \"Go through every item in this list and extract the prices.\" The sidebar auto-routes to the right model: Sonnet for fast actions (click, navigate, screenshot) and Opus for reading and analysis. Each task gets up to 5 minutes. The sidebar agent runs in an isolated session, so it won't interfere with your main Claude Code window. One-click cookie import right from the sidebar footer."
                - paragraph [ref=e2402]:
                  - strong [ref=e2403]: Personal automation.
                  - text: "The sidebar agent isn't just for dev workflows. Example: \"Browse my kid's school parent portal and add all the other parents' names, phone numbers, and photos to my Google Contacts.\" Two ways to get authenticated: (1) log in once in the headed browser, your session persists, or (2) click the \"cookies\" button in the sidebar footer to import cookies from your real Chrome. Once authenticated, Claude navigates the directory, extracts the data, and creates the contacts."
                - paragraph [ref=e2404]:
                  - strong [ref=e2405]: Prompt injection defense.
                  - text: "Hostile web pages try to hijack your sidebar agent. gstack ships a layered defense: a 22MB ML classifier bundled with the browser scans every page and tool output locally, a Claude Haiku transcript check votes on the full conversation shape, a random canary token in the system prompt catches session exfil attempts across text, tool args, URLs, and file writes, and a verdict combiner requires two classifiers to agree before blocking (prevents single-model false positives on Stack Overflow-style instruction pages). A shield icon in the sidebar header shows status (green/amber/red). Opt in to a 721MB DeBERTa-v3 ensemble via"
                  - code [ref=e2406]: GSTACK_SECURITY_ENSEMBLE=deberta
                  - text: "for 2-of-3 agreement. Emergency kill switch:"
                  - code [ref=e2407]: GSTACK_SECURITY_OFF=1
                  - text: . See
                  - link "ARCHITECTURE.md" [ref=e2408] [cursor=pointer]:
                    - /url: /garrytan/gstack/blob/main/ARCHITECTURE.md#prompt-injection-defense-sidebar-agent
                  - text: for the full stack.
                - paragraph [ref=e2409]:
                  - strong [ref=e2410]: Browser handoff when the AI gets stuck.
                  - text: Hit a CAPTCHA, auth wall, or MFA prompt?
                  - code [ref=e2411]: $B handoff
                  - text: opens a visible Chrome at the exact same page with all your cookies and tabs intact. Solve the problem, tell Claude you're done,
                  - code [ref=e2412]: $B resume
                  - text: picks up right where it left off. The agent even suggests it automatically after 3 consecutive failures.
                - paragraph [ref=e2413]:
                  - strong [ref=e2414]:
                    - code [ref=e2415]: /pair-agent
                    - text: is cross-agent coordination.
                  - text: You're in Claude Code. You also have OpenClaw running. Or Hermes. Or Codex. You want them both looking at the same website. Type
                  - code [ref=e2416]: /pair-agent
                  - text: ", pick your agent, and a GStack Browser window opens so you can watch. The skill prints a block of instructions. Paste that block into the other agent's chat. It exchanges a one-time setup key for a session token, creates its own tab, and starts browsing. You see both agents working in the same browser, each in their own tab, neither able to interfere with the other. If ngrok is installed, the tunnel starts automatically so the other agent can be on a completely different machine. Same-machine agents get a zero-friction shortcut that writes credentials directly. This is the first time AI agents from different vendors can coordinate through a shared browser with real security: scoped tokens, tab isolation, rate limiting, domain restrictions, and activity attribution."
                - paragraph [ref=e2417]:
                  - strong [ref=e2418]: Multi-AI second opinion.
                  - code [ref=e2419]: /codex
                  - text: "gets an independent review from OpenAI's Codex CLI — a completely different AI looking at the same diff. Three modes: code review with a pass/fail gate, adversarial challenge that actively tries to break your code, and open consultation with session continuity. When both"
                  - code [ref=e2420]: /review
                  - text: (Claude) and
                  - code [ref=e2421]: /codex
                  - text: (OpenAI) have reviewed the same branch, you get a cross-model analysis showing which findings overlap and which are unique to each.
                - paragraph [ref=e2422]:
                  - strong [ref=e2423]: Safety guardrails on demand.
                  - text: Say "be careful" and
                  - code [ref=e2424]: /careful
                  - text: warns before any destructive command — rm -rf, DROP TABLE, force-push, git reset --hard.
                  - code [ref=e2425]: /freeze
                  - text: locks edits to one directory while debugging so Claude can't accidentally "fix" unrelated code.
                  - code [ref=e2426]: /guard
                  - text: activates both.
                  - code [ref=e2427]: /investigate
                  - text: auto-freezes to the module being investigated.
                - paragraph [ref=e2428]:
                  - strong [ref=e2429]: Proactive skill suggestions.
                  - text: gstack notices what stage you're in — brainstorming, reviewing, debugging, testing — and suggests the right skill. Don't like it? Say "stop suggesting" and it remembers across sessions.
                - generic [ref=e2430]:
                  - heading "10-15 parallel sprints" [level=2] [ref=e2431]
                  - 'link "Permalink: 10-15 parallel sprints" [ref=e2432] [cursor=pointer]':
                    - /url: "#10-15-parallel-sprints"
                - paragraph [ref=e2435]: gstack is powerful with one sprint. It is transformative with ten running at once.
                - paragraph [ref=e2436]:
                  - link "Conductor" [ref=e2437] [cursor=pointer]:
                    - /url: https://conductor.build
                  - text: runs multiple Claude Code sessions in parallel — each in its own isolated workspace. One session running
                  - code [ref=e2438]: /office-hours
                  - text: on a new idea, another doing
                  - code [ref=e2439]: /review
                  - text: on a PR, a third implementing a feature, a fourth running
                  - code [ref=e2440]: /qa
                  - text: on staging, and six more on other branches. All at the same time. I regularly run 10-15 parallel sprints — that's the practical max right now.
                - paragraph [ref=e2441]: "The sprint structure is what makes parallelism work. Without a process, ten agents is ten sources of chaos. With a process — think, plan, build, review, test, ship — each agent knows exactly what to do and when to stop. You manage them the way a CEO manages a team: check in on the decisions that matter, let the rest run."
