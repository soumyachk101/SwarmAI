                      - cell [ref=e2265]:
                        - strong [ref=e2266]: Token bill-of-materials
                        - text: "— read-only, offline audit of what an installed skills tree costs in tokens: always-on frontmatter every session pays vs per-invocation SKILL.md + forced references."
                        - code [ref=e2267]: "--diff"
                        - text: compares two trees,
                        - code [ref=e2268]: "--budget"
                        - text: enforces a ceiling,
                        - code [ref=e2269]: "--exact"
                        - text: opts into Anthropic
                        - code [ref=e2270]: count_tokens
                        - text: (sends file text off-machine; writes an egress receipt first, degrades to the offline estimate if the receipt can't be written).
                    - row [ref=e2271]:
                      - cell [ref=e2272]:
                        - code [ref=e2273]: gstack-code-intelligence
                      - cell [ref=e2274]:
                        - strong [ref=e2275]: Code-intelligence provider picker
                        - text: "— wraps GBrain, Sourcebot, and Graphify behind one interface:"
                        - code [ref=e2276]: options
                        - text: /
                        - code [ref=e2277]: status
                        - text: to see what's available,
                        - code [ref=e2278]: select
                        - text: to pick one,
                        - code [ref=e2279]: index
                        - text: /
                        - code [ref=e2280]: search
                        - text: to use it,
                        - code [ref=e2281]: suggest
                        - text: to check whether the one-time indexing offer should fire here. The offer triggers on large repos (1,000+ tracked files; a decline is persisted). Non-local providers refuse to index
                        - emphasis [ref=e2282]: or search
                        - text: until you record per-repo consent (
                        - code [ref=e2283]: consent <repo> yes|no
                        - text: — the query text is repo-derived content), the per-repo trust policy's deny and read-only tiers veto write-class operations regardless of consent, and every off-machine send writes an egress receipt. Fully optional — with nothing selected, gstack falls back to grep.
                    - row [ref=e2284]:
                      - cell [ref=e2285]:
                        - code [ref=e2286]: gstack-verify-gate
                      - cell [ref=e2287]:
                        - strong [ref=e2288]: Verification stop hook (opt-in)
                        - text: "— blocks a Claude Code turn from ending until the project's declared verify command passes (after 3 blocked re-entries it yields with a loud still-RED warning instead of looping forever). Declare it on one line in CLAUDE.md:"
                        - code [ref=e2289]: "<!-- gstack:verify: bun test -->"
                        - text: . Hooks bypass the permission system, so a declared command never runs until you trust it once per repo (
                        - code [ref=e2290]: gstack-verify-gate --trust
                        - text: ); editing the command invalidates trust until re-granted, and every grant is audit-logged.
                        - code [ref=e2291]: ./setup
                        - text: never registers it for you — opt in with
                        - code [ref=e2292]: gstack-settings-hook add-event --event Stop --command ~/.claude/skills/gstack/bin/gstack-verify-gate --source verify-gate
                        - text: ", remove with"
                        - code [ref=e2293]: gstack-settings-hook remove-source --source verify-gate
                        - text: .
