                      - cell [ref=e2254]:
                        - code [ref=e2255]: gstack-egress
                      - cell [ref=e2256]:
                        - strong [ref=e2257]: Egress receipt auditor
                        - text: — every gstack-initiated off-machine send writes a tamper-evident, hash-chained receipt to
                        - code [ref=e2258]: ~/.gstack/security/egress.jsonl
                        - text: before the send.
                        - code [ref=e2259]: list
                        - text: shows what gstack attempted to send and to which host,
                        - code [ref=e2260]: grants
                        - text: shows the standing consent settings plus the exact command that revokes each,
                        - code [ref=e2261]: verify
                        - text: recomputes the hash chain and exits 3 on tamper.
                    - row [ref=e2262]:
