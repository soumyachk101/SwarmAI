              - article [ref=e1616]:
                - generic [ref=e1617]:
                  - heading "gstack" [level=1] [ref=e1618]
                  - 'link "Permalink: gstack" [ref=e1619] [cursor=pointer]':
                    - /url: "#gstack"
                - blockquote [ref=e1622]:
                  - paragraph [ref=e1623]:
                    - text: "\"I don't think I've typed like a line of code probably since December, basically, which is an extremely large change.\" —"
                    - link "Andrej Karpathy" [ref=e1624] [cursor=pointer]:
                      - /url: https://fortune.com/2026/03/21/andrej-karpathy-openai-cofounder-ai-agents-coding-state-of-psychosis-openclaw/
                    - text: ", No Priors podcast, March 2026"
                - paragraph [ref=e1625]:
                  - text: When I heard Karpathy say this, I wanted to find out how. How does one person ship like a team of twenty? Peter Steinberger built
                  - link "OpenClaw" [ref=e1626] [cursor=pointer]:
                    - /url: https://github.com/openclaw/openclaw
                  - text: — 247K GitHub stars — essentially solo with AI agents. The revolution is here. A single builder with the right tooling can move faster than a traditional team.
                - paragraph [ref=e1627]:
                  - text: I'm
                  - link "Garry Tan" [ref=e1628] [cursor=pointer]:
                    - /url: https://x.com/garrytan
                  - text: ", President & CEO of"
                  - link "Y Combinator" [ref=e1629] [cursor=pointer]:
                    - /url: https://www.ycombinator.com/
                  - text: . I've worked with thousands of startups — Coinbase, Instacart, Rippling — when they were one or two people in a garage. Before YC, I was one of the first eng/PM/designers at Palantir, cofounded Posterous (sold to Twitter), and built Bookface, YC's internal social network.
                - paragraph [ref=e1630]:
                  - strong [ref=e1631]: gstack is my answer.
                  - text: "I've been building products for twenty years, and right now I'm shipping more products than I ever have. In the last 60 days: 3 production services, 40+ shipped features, part-time, while running YC full-time. On logical code change — not raw LOC, which AI inflates — my 2026 run rate is"
                  - strong [ref=e1632]: ~810× my 2013 pace
                  - text: (11,417 vs 14 logical lines/day). Year-to-date (through April 18), 2026 has already produced
                  - strong [ref=e1633]: 240× the entire 2013 year
                  - text: . Measured across 40 public + private
                  - code [ref=e1634]: garrytan/*
                  - text: repos including Bookface, after excluding one demo repo. AI wrote most of it. The point isn't who typed it, it's what shipped.
                - blockquote [ref=e1635]:
                  - paragraph [ref=e1636]:
                    - text: "The LOC critics aren't wrong that raw line counts inflate with AI. They are wrong that normalized-for-inflation, I'm less productive. I'm more productive, by a lot. Full methodology, caveats, and reproduction script:"
                    - strong [ref=e1637]:
                      - link "On the LOC Controversy" [ref=e1638] [cursor=pointer]:
                        - /url: /garrytan/gstack/blob/main/docs/ON_THE_LOC_CONTROVERSY.md
                    - text: .
                - paragraph [ref=e1639]:
                  - strong [ref=e1640]: "2026 — 1,237 contributions and counting:"
                - paragraph [ref=e1641]:
                  - link [ref=e1642] [cursor=pointer]:
                    - /url: /garrytan/gstack/blob/main/docs/images/github-2026.png
                    - img "GitHub contributions 2026 — 1,237 contributions, massive acceleration in Jan-Mar" [ref=e1643]
                - paragraph [ref=e1644]:
                  - strong [ref=e1645]: "2013 — when I built Bookface at YC (772 contributions):"
                - paragraph [ref=e1646]:
                  - link [ref=e1647] [cursor=pointer]:
                    - /url: /garrytan/gstack/blob/main/docs/images/github-2013.png
                    - img "GitHub contributions 2013 — 772 contributions building Bookface at YC" [ref=e1648]
                - paragraph [ref=e1649]: Same person. Different era. The difference is the tooling.
                - paragraph [ref=e1650]:
                  - strong [ref=e1651]: gstack is how I do it.
                  - text: It turns Claude Code into a virtual engineering team — a CEO who rethinks the product, an eng manager who locks architecture, a designer who catches AI slop, a reviewer who finds production bugs, a QA lead who opens a real browser, a security officer who runs OWASP + STRIDE audits, and a release engineer who ships the PR. Twenty-three specialists and eight power tools, all slash commands, all Markdown, all free, MIT license.
                - paragraph [ref=e1652]: This is my open source software factory. I use it every day. I'm sharing it because these tools should be available to everyone.
                - paragraph [ref=e1653]: Fork it. Improve it. Make it yours. And if you want to hate on free open source software — you're welcome to, but I'd rather you just try it first.
                - paragraph [ref=e1654]:
                  - strong [ref=e1655]: "Who this is for:"
                - list [ref=e1656]:
                  - listitem [ref=e1657]:
                    - strong [ref=e1658]: Founders and CEOs
                    - text: — especially technical ones who still want to ship
                  - listitem [ref=e1659]:
                    - strong [ref=e1660]: First-time Claude Code users
                    - text: — structured roles instead of a blank prompt
                  - listitem [ref=e1661]:
                    - strong [ref=e1662]: Tech leads and staff engineers
                    - text: — rigorous review, QA, and release automation on every PR
                - generic [ref=e1663]:
                  - heading "Quick start" [level=2] [ref=e1664]
                  - 'link "Permalink: Quick start" [ref=e1665] [cursor=pointer]':
                    - /url: "#quick-start"
