                - paragraph [ref=e2650]:
                  - text: gstack includes
                  - strong [ref=e2651]: opt-in
                  - text: "usage telemetry to help improve the project. Here's exactly what happens:"
                - list [ref=e2652]:
                  - listitem [ref=e2653]:
                    - strong [ref=e2654]: Default is off.
                    - text: Nothing is sent anywhere unless you explicitly say yes.
                  - listitem [ref=e2655]:
                    - strong [ref=e2656]: On first run,
                    - text: gstack asks if you want to share anonymous usage data. You can say no.
                  - listitem [ref=e2657]:
                    - strong [ref=e2658]: "What's sent (if you opt in):"
                    - text: skill name, duration, success/fail, gstack version, OS. That's it.
                  - listitem [ref=e2659]:
                    - strong [ref=e2660]: "What's never sent:"
                    - text: code, file paths, repo names, branch names, prompts, or any user-generated content.
                  - listitem [ref=e2661]:
                    - strong [ref=e2662]: "Change anytime:"
                    - code [ref=e2663]: gstack-config set telemetry off
                    - text: disables everything instantly.
                  - listitem [ref=e2664]:
                    - strong [ref=e2665]: Every off-machine send is receipted.
                    - text: Any gstack-initiated network send — telemetry included — writes a hash-chained, tamper-evident receipt to
                    - code [ref=e2666]: ~/.gstack/security/egress.jsonl
                    - text: before the send; sensitive sinks refuse to send at all if the receipt can't be written. Audit with
                    - code [ref=e2667]: gstack-egress list
                    - text: ", verify the chain with"
                    - code [ref=e2668]: gstack-egress verify
                    - text: (exit 3 on tamper), see the standing consent settings with
                    - code [ref=e2669]: gstack-egress grants
                    - text: . The ledger records attempted sends so accidents are auditable — it's an audit trail, not a network firewall.
                - paragraph [ref=e2670]:
                  - text: Data is stored in
                  - link "Supabase" [ref=e2671] [cursor=pointer]:
