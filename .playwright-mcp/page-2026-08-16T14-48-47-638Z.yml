                - generic [ref=e1868]:
                  - code [ref=e1870]: "You: I want to build a daily briefing app for my calendar. You: /office-hours Claude: [asks about the pain — specific examples, not hypotheticals] You: Multiple Google calendars, events with stale info, wrong locations. Prep takes forever and the results aren't good enough... Claude: I'm going to push back on the framing. You said \"daily briefing app.\" But what you actually described is a personal chief of staff AI. [extracts 5 capabilities you didn't realize you were describing] [challenges 4 premises — you agree, disagree, or adjust] [generates 3 implementation approaches with effort estimates] RECOMMENDATION: Ship the narrowest wedge tomorrow, learn from real usage. The full vision is a 3-month project — start with the daily briefing that actually works. [writes design doc → feeds into downstream skills automatically] You: /plan-ceo-review [reads the design doc, challenges scope, runs 10-section review] You: /plan-eng-review [ASCII diagrams for data flow, state machines, error paths] [test matrix, failure modes, security concerns] You: Approve plan. Exit plan mode. [writes 2,400 lines across 11 files. ~8 minutes.] You: /review [AUTO-FIXED] 2 issues. [ASK] Race condition → you approve fix. You: /qa https://staging.myapp.com [opens real browser, clicks through flows, finds and fixes a bug] You: /ship Tests: 42 → 51 (+9 new). PR: github.com/you/app/pull/42"
                  - button "Copy code to clipboard" [ref=e1872] [cursor=pointer]
                - paragraph [ref=e1876]: You said "daily briefing app." The agent said "you're building a chief of staff AI" — because it listened to your pain, not your feature request. Eight commands, end to end. That is not a copilot. That is a team.
